name: Probe RTSP URL formats (read-only)

# Read-only. Builds the RTSP URL with PROPER percent-encoding of the stored
# credentials (read server-side, never printed) and runs ffprobe on the main
# and sub streams - plain, and with the app's flags - to tell whether the
# stream itself is readable (=> our flags/code) or not (=> NVR codec/permission).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: droplet-diagnostics
  cancel-in-progress: true

jobs:
  probe:
    name: Probe RTSP variants
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check Droplet secrets
        id: secrets
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          if [ -z "$DO_HOST" ] || [ -z "$DO_USER" ] || [ -z "$DO_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe on Droplet
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -uo pipefail
            cd /opt/ai_vision || { echo "No /opt/ai_vision"; exit 1; }
            # Everything runs INSIDE the backend container in Python: reads the
            # stored creds, percent-encodes them, builds URLs, runs ffprobe, and
            # prints ONLY codec/status - never the URL or password.
            docker compose exec -T backend python - <<'PY'
            import sqlite3, subprocess
            from urllib.parse import urlsplit, unquote, quote

            con = sqlite3.connect("/app/database/cameras.db")
            row = con.execute("SELECT stream_url FROM cameras WHERE stream_url LIKE 'rtsp://%:%@%' LIMIT 1").fetchone()
            if not row:
                print("No stored credentials found."); raise SystemExit
            u = urlsplit(row[0])
            user = quote(unquote(u.username or ""), safe="")
            pw = quote(unquote(u.password or ""), safe="")
            host = "87.192.242.82"

            def probe(label, path, transport, extra=None):
                url = f"rtsp://{user}:{pw}@{host}:554{path}"
                cmd = ["ffprobe", "-hide_banner", "-rtsp_transport", transport]
                if extra:
                    cmd += extra
                cmd += ["-i", url, "-show_entries", "stream=codec_name,codec_type,width,height",
                        "-of", "default=noprint_wrappers=1"]
                try:
                    out = subprocess.run(cmd, capture_output=True, text=True, timeout=20)
                    txt = (out.stdout + out.stderr)
                except subprocess.TimeoutExpired:
                    txt = "TIMEOUT (no response in 20s)"
                keep = []
                for line in txt.splitlines():
                    l = line.lower()
                    if any(k in l for k in ("codec_name", "codec_type", "width", "height",
                                            "invalid", "401", "unauthor", "404", "not found",
                                            "refused", "timed out", "timeout", "server returned",
                                            "method", "does not contain", "immediate exit")):
                        keep.append(line.strip())
                print(f"----- {label} -----")
                print("\n".join(keep[:10]) or "(no diagnostic lines)")
                print()

            print("================= RTSP PROBE (encoded creds) =================")
            probe("ch5 MAIN /Streaming/Channels/501  (tcp, plain ffprobe)", "/Streaming/Channels/501", "tcp")
            probe("ch5 MAIN /Streaming/Channels/501  (udp, plain ffprobe)", "/Streaming/Channels/501", "udp")
            probe("ch5 MAIN /Streaming/Channels/501  (tcp, app flags)", "/Streaming/Channels/501", "tcp",
                  extra=["-probesize", "1048576", "-analyzeduration", "1000000", "-fflags", "+discardcorrupt"])
            probe("ch5 SUB  /Streaming/Channels/502  (tcp, plain ffprobe)", "/Streaming/Channels/502", "tcp")
            probe("ch2 MAIN /Streaming/Channels/201  (tcp, plain ffprobe)", "/Streaming/Channels/201", "tcp")
            print("A block printing codec_name=h264/hevc + width/height = that stream is readable.")
            PY
            echo "Probe complete."
