<style>
:root{--bg:#070d18;--panel:#0d1526;--panel2:#111d33;--line:#1e2c46;--line2:#28395a;
 --text:#aeb9cc;--muted:#7a8aa3;--head:#f1f5f9;--cy:#38bdf8;--amb:#fbbf24;--good:#34d399;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
/* header */
.appbar{display:flex;align-items:center;gap:16px;height:54px;padding:0 18px;
 background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:2.5px;font-size:12px;color:var(--cy)}
.brand .lg{width:18px;height:18px;border-radius:5px;background:#0b1624;position:relative}
.brand .lg::before{content:"";position:absolute;inset:3.5px;border:2px solid var(--cy);border-radius:50%}
.brand .lg::after{content:"";position:absolute;inset:7px;background:var(--cy);border-radius:50%}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--amb);
 border:1px solid color-mix(in srgb,var(--amb) 45%,var(--line));border-radius:20px;padding:3px 10px}
.appbar .sp{flex:1}
.appbar label{font-size:11px;color:var(--muted);font-weight:600}
select,.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line2);border-radius:8px;
 font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;cursor:pointer}
select:hover,.btn:hover{border-color:var(--muted)}
.btn.primary{background:color-mix(in srgb,var(--cy) 18%,transparent);color:var(--cy);border-color:color-mix(in srgb,var(--cy) 45%,transparent)}
.title{color:var(--head);font-weight:700;font-size:14px}
.title small{color:var(--muted);font-weight:500;margin-left:8px;font-size:11.5px}
/* body */
.main{flex:1;display:flex;min-height:0}
.nav{width:230px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);
 overflow-y:auto;padding:14px 12px}
.navgroup{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
 font-weight:700;margin:14px 8px 6px}
.navgroup:first-child{margin-top:2px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;
 border:1px solid transparent;border-radius:9px;padding:8px 10px;margin-bottom:2px;color:var(--text)}
.navitem:hover{background:var(--panel2)}
.navitem.active{background:color-mix(in srgb,var(--cy) 14%,transparent);border-color:color-mix(in srgb,var(--cy) 30%,transparent)}
.navitem .dot{width:7px;height:7px;border-radius:2px;background:var(--line2);flex:0 0 auto}
.navitem.active .dot{background:var(--cy)}
.navitem .nt{font-size:12.5px;font-weight:600;color:var(--head);line-height:1.25}
.navitem .nt small{display:block;font-weight:500;color:var(--muted);font-size:10px}
/* stage */
.stage{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;
 padding:26px;overflow:auto;
 background:radial-gradient(1200px 600px at 50% -10%,rgba(56,189,248,.06),transparent 70%)}
.screen{display:none;width:100%;height:100%;align-items:center;justify-content:center}
.screen.active{display:flex;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.frame{position:relative;max-width:100%;max-height:100%;border-radius:14px;overflow:hidden;
 border:1px solid var(--line2);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.frame svg{width:100%;height:100%}
.hotspots{position:absolute;inset:0;pointer-events:none}
.hs{position:absolute;pointer-events:auto;background:transparent;border:0;border-radius:8px;cursor:pointer;
 padding:0;transition:background .15s,box-shadow .15s}
.hs:hover{background:rgba(56,189,248,.14);box-shadow:0 0 0 1.5px rgba(56,189,248,.6)}
body.show-hs .hs{background:rgba(56,189,248,.12);box-shadow:0 0 0 1.5px rgba(56,189,248,.5);
 animation:pulse 1.2s ease infinite}
@keyframes pulse{50%{background:rgba(56,189,248,.24)}}
/* footer hint */
.hint{flex:0 0 auto;height:34px;display:flex;align-items:center;gap:18px;padding:0 18px;
 background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.hint b{color:var(--text);font-weight:600}
.kbd{font-family:ui-monospace,monospace;background:var(--panel2);border:1px solid var(--line2);
 border-radius:5px;padding:1px 6px;font-size:10.5px;color:var(--text)}
/* toast */
.toasts{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);z-index:50;
 display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--panel2);border:1px solid var(--good);color:var(--head);border-radius:10px;
 padding:10px 16px;font-size:12.5px;font-weight:600;box-shadow:0 12px 30px -12px rgba(0,0,0,.7);
 display:flex;align-items:center;gap:9px;animation:pop .3s ease}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.arrows{display:flex;gap:6px}
.arrows button{width:34px;height:32px;display:grid;place-items:center;font-size:14px}
@media (max-width:820px){.nav{display:none}}
</style>

  const availW=stage.clientWidth-52, availH=stage.clientHeight-52;
  let w=availW, h=w*H/W;
  if(h>availH){ h=availH; w=h*W/H; }
  f.style.width=Math.round(w)+'px'; f.style.height=Math.round(h)+'px';
}
window.addEventListener('resize',fit);
function show(id){
  cur=id;
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.dataset.id===id));
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active',n.dataset.goto===id));
  const t=TITLES[id]||{en:id,mod:''};
  document.getElementById('scTitle').innerHTML=t.en+'<small>'+t.mod+'</small>';
  const stage=document.getElementById('stage'); stage.scrollTop=0;
  fit();
}
function step(d){ const s=seq(); let i=s.indexOf(cur); if(i<0)i=0; i=(i+d+s.length)%s.length; show(s[i]); }
function toast(msg){
  const c=document.getElementById('toasts'); const el=document.createElement('div');
  el.className='toast'; el.textContent=msg; c.appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .4s';el.style.opacity='0';setTimeout(()=>el.remove(),400);},2200);
}
// hotspot clicks
document.getElementById('stage').addEventListener('click',e=>{
  const b=e.target.closest('.hs'); if(!b)return;
  if(b.dataset.target) show(b.dataset.target);
  else if(b.dataset.toast) toast(b.dataset.toast);
});
// nav clicks
nav.addEventListener('click',e=>{const b=e.target.closest('.navitem'); if(b) show(b.dataset.goto);});
// controls
document.getElementById('next').onclick=()=>step(1);
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('restart').onclick=()=>{const s=seq();show(s[0]);};
document.getElementById('hsBtn').onclick=()=>document.body.classList.toggle('show-hs');
document.getElementById('flow').onchange=e=>{
  flow=FLOWS[e.target.value]||[]; const s=seq(); show(s[0]);
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')step(1); else if(e.key==='ArrowLeft')step(-1);
  else if(e.key.toLowerCase()==='h')document.body.classList.toggle('show-hs');
  else if(e.key.toLowerCase()==='r'){const s=seq();show(s[0]);}
});
function fromHash(){ const id=(location.hash||'').slice(1); return TITLES[id]?id:null; }
window.addEventListener('hashchange',()=>{const id=fromHash(); if(id)show(id);});
show(fromHash()||'login');
</script>
