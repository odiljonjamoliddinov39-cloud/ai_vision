cameras:
# Training deployment: only the selected Zavod channels, main stream (higher
# quality). All other cameras are intentionally left out.
- name: Block A - Zavod Channel 5
  source: rtsp://87.192.242.82:554/Streaming/Channels/501
  slot_number: 1
- name: Block A - Zavod Channel 6
  source: rtsp://87.192.242.82:554/Streaming/Channels/601
  slot_number: 2
- name: Block A - Zavod Channel 2
  source: rtsp://87.192.242.82:554/Streaming/Channels/201
  slot_number: 3
- name: Block B - Zavod Channel 16
  source: rtsp://87.192.242.82:554/Streaming/Channels/1601
  slot_number: 4
- name: Block C - Zavod Channel 20
  source: rtsp://87.192.242.82:554/Streaming/Channels/2001
  slot_number: 5
- name: Block C - Zavod Channel 23
  source: rtsp://87.192.242.82:554/Streaming/Channels/2301
  slot_number: 6
- name: Block D - Zavod Channel 25
  source: rtsp://87.192.242.82:554/Streaming/Channels/2501
  slot_number: 7
detection:
  model_path: yoloe-26s-seg.pt
  fallback_model_path: yolov8s-worldv2.pt
  confidence_threshold: 0.4
  iou_threshold: 0.55
  max_detections: 300
  image_size: 640
  class_agnostic_nms: false
  device: auto
  target_fps: 2.0
  stale_after_ms: 3000
  max_concurrent_cameras: 0
  classes: null
  class_prompts:
  - baget box
  - stack of baget boxes
  - cardboard box
  - stack of cardboard boxes
  - sack of flour
  - stack of flour sacks
  - woven sack
  - bag of flour
  - large bag
  - wrapped pallet
  - wooden pallet
  - warehouse package
spatial_analysis:
  enabled: false
  horizontal_fov_degrees: 90.0
  camera_height_m: 1.2
  horizon_y_ratio: 0.28
  min_distance_m: 0.5
  max_distance_m: 50.0
  estimate_depth_layers: false
  max_units_per_detection: 200
  unit_dimensions:
    baget box:
      width_m: 0.45
      height_m: 0.35
      depth_m: 0.35
    cardboard box:
      width_m: 0.45
      height_m: 0.35
      depth_m: 0.35
    sack:
      width_m: 0.55
      height_m: 0.18
      depth_m: 0.25
display:
  show_fps: true
  window_prefix: AI Vision -
  box_thickness: 2
  font_scale: 0.6
  live_feed_enabled: true
  live_frame_width: 1280
  live_frame_jpeg_quality: 85
tracking:
  enabled: false
  tracker_config: config/warehouse_bytetrack.yaml
  classes: null
  grace_period_seconds: 5.0
  db_path: database/tracking.db
warehouse_counting:
  enabled: false
  mode: line
  db_path: database/warehouse.db
  confidence_threshold: 0.55
  count_low_confidence_as_unknown: false
  counting_line:
    x1: 100
    y1: 300
    x2: 900
    y2: 300
warehouse_engine:
  enabled: false
  engine_db_path: database/warehouse_engine.db
  minimum_confidence: 0.8
  identity_recovery_seconds: 30
  lost_timeout_seconds: 10
  stopped_pixels: 8
  zones:
  - name: Receiving
    polygon: [[0, 0], [1280, 0], [1280, 360], [0, 360]]
  - name: Storage
    polygon: [[0, 360], [1280, 360], [1280, 720], [0, 720]]
recognition:
  enabled: false
  provider: gemini
  model: gemini-3.1-flash-lite
  db_path: database/products.db
  confidence_threshold: 0.9
  similarity_threshold: 0.62
  cache_enabled: true
  cache_expiration: 1800
  timeout: 30
  retries: 2
  max_workers: 2
  catalog_only: true
  catalog_db_path: database/catalog.db
snapshots:
  enabled: true
  save_dir: snapshots
  trigger_classes:
  - person
  - car
  cooldown_seconds: 5
logging:
  enabled: true
  log_dir: logs
  log_file: events.log
