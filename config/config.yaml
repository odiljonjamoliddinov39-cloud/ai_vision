cameras:
- name: Demo Camera
  source: dummy
  slot_number: 1
- name: 87.192.242.82 Stream
  source: rtsp://87.192.242.82:554/
  slot_number: 2
detection:
  model_path: yolov8s-world.pt
  confidence_threshold: 0.2
  image_size: 512
  class_agnostic_nms: true
  device: cpu
  target_fps: 2.0
  stale_after_ms: 3000
  max_concurrent_cameras: 0
  classes: null
  class_prompts:
  - baget box
  - baguette box
  - stack of baget boxes
  - stack of cardboard boxes
  - cardboard box
  - stack of sacks
  - sack of flour
  - large bag
  - wrapped pallet
  - wooden pallet
  - warehouse package
spatial_analysis:
  enabled: true
  horizontal_fov_degrees: 90.0
  camera_height_m: 1.2
  horizon_y_ratio: 0.28
  min_distance_m: 0.5
  max_distance_m: 50.0
  estimate_depth_layers: false
  max_units_per_detection: 200
  unit_dimensions:
    baget box:
      width_m: 0.45
      height_m: 0.35
      depth_m: 0.35
    cardboard box:
      width_m: 0.45
      height_m: 0.35
      depth_m: 0.35
    sack:
      width_m: 0.55
      height_m: 0.18
      depth_m: 0.25
display:
  show_fps: true
  window_prefix: AI Vision -
  box_thickness: 2
  font_scale: 0.6
  live_feed_enabled: true
  live_frame_width: 1280
  live_frame_jpeg_quality: 85
tracking:
  enabled: true
  tracker_config: config/warehouse_bytetrack.yaml
  classes: null
  grace_period_seconds: 5.0
  db_path: database/tracking.db
warehouse_counting:
  enabled: true
  mode: line
  db_path: database/warehouse.db
  confidence_threshold: 0.55
  count_low_confidence_as_unknown: false
  counting_line:
    x1: 100
    y1: 300
    x2: 900
    y2: 300
warehouse_engine:
  enabled: true
  engine_db_path: database/warehouse_engine.db
  minimum_confidence: 0.8
  identity_recovery_seconds: 30
  lost_timeout_seconds: 10
  stopped_pixels: 8
  zones:
  - name: Receiving
    polygon: [[0, 0], [1280, 0], [1280, 360], [0, 360]]
  - name: Storage
    polygon: [[0, 360], [1280, 360], [1280, 720], [0, 720]]
recognition:
  enabled: true
  provider: gemini
  model: gemini-3.1-flash-lite
  db_path: database/products.db
  confidence_threshold: 0.9
  similarity_threshold: 0.92
  cache_enabled: true
  cache_expiration: 1800
  timeout: 30
  retries: 2
  max_workers: 2
  catalog_only: true
  catalog_db_path: database/catalog.db
snapshots:
  enabled: true
  save_dir: snapshots
  trigger_classes:
  - person
  - car
  cooldown_seconds: 5
logging:
  enabled: true
  log_dir: logs
  log_file: events.log
