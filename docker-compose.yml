services:
  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    volumes:
      - ./infrastructure/mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings
    ports:
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554"
      - "${MEDIAMTX_HLS_PORT:-8888}:8888"
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "${MEDIAMTX_WEBRTC_UDP_PORT:-8189}:8189/udp"
      - "127.0.0.1:${MEDIAMTX_API_PORT:-9997}:9997"
    expose:
      - "9997"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-vision-backend:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      # Production requirement: camera processing must recover after every
      # container/server restart even if an older persistent .env disabled it.
      AUTO_START_DETECTION: "true"
      DETECTION_WATCHDOG_ENABLED: "true"
      CATALOG_RECOGNITION_SCHEDULER_ENABLED: "true"
      CATALOG_RECOGNITION_INTERVAL_HOURS: "12"
      AI_VISION_ENTERPRISE_STREAMING: "${AI_VISION_ENTERPRISE_STREAMING:-true}"
      MEDIAMTX_REQUIRED: "${MEDIAMTX_REQUIRED:-false}"
      MEDIAMTX_STRICT_STARTUP: "${MEDIAMTX_STRICT_STARTUP:-false}"
      EMBEDDED_MEDIAMTX: "false"
      MEDIAMTX_API_URL: "http://mediamtx:9997"
      MEDIAMTX_RTSP_URL: "rtsp://mediamtx:8554"
      MEDIAMTX_WEBRTC_URL: "http://mediamtx:8889"
      MEDIAMTX_HLS_URL: "http://mediamtx:8888"
      MEDIAMTX_PUBLIC_WEBRTC_URL: "${MEDIAMTX_PUBLIC_WEBRTC_URL:-http://localhost:8889}"
      MEDIAMTX_PUBLIC_HLS_URL: "${MEDIAMTX_PUBLIC_HLS_URL:-http://localhost:8888}"
      AI_STREAM_WIDTH: "${AI_STREAM_WIDTH:-960}"
      AI_STREAM_FPS: "${AI_STREAM_FPS:-6}"
      DASHBOARD_STREAM_WIDTH: "${DASHBOARD_STREAM_WIDTH:-640}"
      DASHBOARD_STREAM_FPS: "${DASHBOARD_STREAM_FPS:-6}"
      # Keep the full AI rendition fan-out disabled. The comparison dashboard
      # publishes only the lightweight H264 rendition required by WebRTC.
      PUBLISH_MEDIAMTX_RENDITIONS: "${PUBLISH_MEDIAMTX_RENDITIONS:-false}"
      MEDIAMTX_PREFER_HIKVISION_SUBSTREAM: "${MEDIAMTX_PREFER_HIKVISION_SUBSTREAM:-true}"
      STREAM_PREVIEW_WIDTH: "${STREAM_PREVIEW_WIDTH:-640}"
      # The JPEG branch feeds snapshots/AI and does not need to match the
      # smoother WebRTC grid. Keeping it at 3 FPS prevents 24 software MJPEG
      # encoders from saturating this 2-vCPU host.
      STREAM_PREVIEW_FPS: "${STREAM_PREVIEW_FPS:-3}"
      STREAM_JPEG_QUALITY: "${STREAM_JPEG_QUALITY:-68}"
      # Timestamp burn-in was only for the latency experiment. It forced
      # Python/OpenCV to decode and re-encode every JPEG and consumed ~48% CPU.
      LIVE_TIMESTAMP_OVERLAY: "${LIVE_TIMESTAMP_OVERLAY:-false}"
      PUBLISH_MEDIAMTX_DASHBOARD: "${PUBLISH_MEDIAMTX_DASHBOARD:-true}"
    depends_on:
      - mediamtx
    ports:
      - "${AI_VISION_PORT:-8080}:8080"
    volumes:
      # Application code is mounted independently from the heavy AI runtime.
      # Operational dashboard/stream updates therefore do not rebuild or
      # export multi-gigabyte Torch/CUDA image layers.
      - ./api/server.py:/app/api/server.py:ro
      - ./main.py:/app/main.py:ro
      - ./streams/manager.py:/app/streams/manager.py:ro
      - ./streams/mediamtx.py:/app/streams/mediamtx.py:ro
      - ./dashboard-v2:/app/dashboard-v2:ro
      - ./models:/app/models
      - ./logs:/app/logs
      - ./snapshots:/app/snapshots
      - ./database:/app/database
      - ./config:/app/config
      - ./recordings:/recordings

  # Optional: enable with `docker compose --profile worker up -d --build ai-worker`
  # only if you want a separate detector process instead of backend autostart.
  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-vision-backend:local
    restart: unless-stopped
    profiles:
      - worker
    env_file:
      - .env
    environment:
      AI_VISION_ENTERPRISE_STREAMING: "${AI_VISION_ENTERPRISE_STREAMING:-true}"
      MEDIAMTX_REQUIRED: "${MEDIAMTX_REQUIRED:-false}"
      MEDIAMTX_API_URL: "http://mediamtx:9997"
      MEDIAMTX_RTSP_URL: "rtsp://mediamtx:8554"
    command: ["python", "main.py", "--config", "config/config.yaml", "--no-display"]
    volumes:
      - ./main.py:/app/main.py:ro
      - ./models:/app/models
      - ./logs:/app/logs
      - ./snapshots:/app/snapshots
      - ./database:/app/database
      - ./config:/app/config
      - ./recordings:/recordings
